# nixpacks.toml for the PIXELHUB Django backend on platforms that build from
# the repository root. The Next.js frontend is deployed as its own application
# using frontend/nixpacks.toml with Build Path = "frontend". Node.js is
# deliberately not installed here: the backend has no Node build step, and
# requesting it forced Nixpacks to compile Node.js and c-ares from source.

[phases.setup]
nixPkgs = ["python311", "cairo", "pango", "gdk-pixbuf", "shared-mime-info"]

[phases.install]
cmds = [
  "python -m venv venv && ./venv/bin/pip install --upgrade pip setuptools wheel && ./venv/bin/pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "./venv/bin/python manage.py collectstatic --noinput",
]

[start]
cmd = "./venv/bin/python manage.py migrate && ./venv/bin/gunicorn pixelhub.wsgi:application -b 0.0.0.0:${PORT:-8080}"
